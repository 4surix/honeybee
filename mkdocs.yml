# ============================================================
# HoneyBee Protocol Documentation — MkDocs Configuration
# Source of truth: the Markdown files in this repository.
# Build: mkdocs build   |   Dev: mkdocs serve
# Docs deps: pip install -r requirements-docs.txt
# 100% native Material (no mermaid2, no minify plugins)
# ============================================================

site_name: HoneyBee Protocol
site_description: Offline, anonymous, BLE-native mesh messaging protocol — normative specification
site_url: https://4surix.github.io/honeybee/
site_author: 4surix
copyright: Apache-2.0 — 4surix/honeybee
repo_url: https://github.com/4surix/honeybee
repo_name: 4surix/honeybee
edit_uri: edit/main/docs/

docs_dir: docs

nav:
  - Home: index.md
  - Specification:
      - Protocol: PROTOCOL.md
      - Security: SECURITY.md
  - Mechanisms:
      - Acknowledgement: mechanisms/ACKNOWLEDGEMENT.md
      - Channels: mechanisms/CHANNELS.md
      - Identification: mechanisms/IDENTIFICATION.md
      - Network: mechanisms/NETWORK.md
      - Packet: mechanisms/PACKET.md
      - Relay: mechanisms/RELAY.md
      - Confidentiality: mechanisms/CONFIDENTIALITY.md
      - Send: mechanisms/SEND.md
      - Receive: mechanisms/RECEIVE.md

theme:
  name: material
  language: en
  logo: images/img-logo-honeybee.png
  favicon: images/favicon.ico
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - content.code.copy
    - content.action.edit
    - toc.follow
    - search.highlight
    - search.suggest
  palette:
    - scheme: default
      primary: deep orange
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true

  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  - attr_list
  - md_in_html

  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - def_list
  - footnotes
  - abbr
  - toc:
      permalink: "#"

plugins:
  - search:
      lang: [en, fr]

extra_javascript:
  - https://unpkg.com/mermaid@10.9.3/dist/mermaid.min.js
  - javascripts/mermaid-init.js
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/4surix/honeybee
  generator: false

